<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName decocakeshop.usercodex.com

    DocumentRoot /home/usercodex/decocakeshop_front
    <Directory /home/usercodex/decocakeshop_front>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8004/api/
    ProxyPassReverse /api/ http://127.0.0.1:8004/api/

    ProxyPass /media/ !
    Alias /media/ /home/usercodex/decocakeshop_src/Backend/media/
    <Directory /home/usercodex/decocakeshop_src/Backend/media>
        Options -Indexes
        Require all granted
    </Directory>

    Alias /static/ /home/usercodex/decocakeshop_src/Backend/staticfiles/
    <Directory /home/usercodex/decocakeshop_src/Backend/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/decocakeshop_error.log
    CustomLog ${APACHE_LOG_DIR}/decocakeshop_access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/decocakeshop.usercodex.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/decocakeshop.usercodex.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
